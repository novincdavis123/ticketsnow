name: Build Flutter App

on:
  push:
    branches:
      - releases
  schedule:
    # Runs every 5 days at 02:30 UTC (08:00 AM IST) to refresh the 7-day cache timer
    - cron: '30 2 */5 * *'

permissions:
  contents: write

env:
  APP_NAME: ticketsnow

jobs:
  build_android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Grant ownership of NDK & CMake directories
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/{ndk,cmake}
          sudo chown -R runner:runner /usr/local/lib/android/sdk/{ndk,cmake}

      - name: Cache Android NDK & CMake
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.*
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-ndk-cmake-${{ runner.os }}-ndk28-${{ hashFiles('android/app/build.gradle.kts', 'android/build.gradle.kts') }}
          restore-keys: |
            android-ndk-cmake-${{ runner.os }}-ndk28-

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        if: github.event_name == 'push'
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename APK with Month and Day
        if: github.event_name == 'push'
        id: rename_apk
        run: |
          DATE_STR=$(TZ='Asia/Kolkata' date +'%b_%d')
          NEW_NAME="${APP_NAME}_${DATE_STR}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${NEW_NAME}"
          echo "apk_name=${NEW_NAME}" >> $GITHUB_OUTPUT
          echo "apk_path=build/app/outputs/flutter-apk/${NEW_NAME}" >> $GITHUB_OUTPUT

      # Option A: Save build inside the GitHub Actions run summary (unzipped)
      - name: Upload Build Artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.rename_apk.outputs.apk_name }}
          path: ${{ steps.rename_apk.outputs.apk_path }}
          archive: false

      # Option B: Publish/overwrite the latest build on the Releases page
      - name: Update Latest Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-build
          name: Latest Build (${{ github.ref_name }})
          files: ${{ steps.rename_apk.outputs.apk_path }}
